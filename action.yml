name: PURLs Submission Action
description: "Submit some PURLs to the Dependency Submission API"
inputs:
  token:
    description: "GitHub Personal Access Token (PAT). Defaults to PAT provided by Actions runner."
    required: false
    default: ${{ github.token }}
  purls:
    description: "The PURLs to submit, one per line"
    required: true
    default: "."
  detector-name:
    description: "Name of the detector"
    required: false
    default: purls-submission-action
  manifest-name:
    description: "Name to give to the manifest. Used as identifier."
    required: false
    default: purls
  manifest-path:
    description: "File path to associate with the manifest."
    required: false
    default: purls
runs:
  using: "node16"
  main: "dist/index.js"
